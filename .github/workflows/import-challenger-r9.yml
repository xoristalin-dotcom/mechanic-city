name: Import Mechanic City Challenger Model

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-model:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[model-import]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Revision 14 car model
        run: |
          mkdir -p public/models
          curl --fail --location --retry 3 --output public/models/challenger-r9.glb 'https://695d5a9fc666e505559765690b5db7dd.r2.cloudflarestorage.com/3d-scene-builder/projects/59a6ad85-c175-4493-818e-c292f8369a70/revisions/00000014-mechanic-parts-separation-r10/preview.glb?X-Amz-Expires=900&X-Amz-Date=20261001T022536Z&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Credential=f4fb15da414147020cebc9c7007b912d%2F20261001%2Fauto%2Fs3%2Faws4_request&X-Amz-SignedHeaders=host&X-Amz-Signature=28dea2f11d23b7b721fa26b47244bf6f9ed7edd08d978f1f15cf1b44cd9ef632'
          test -s public/models/challenger-r9.glb
          ls -lh public/models/challenger-r9.glb
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/challenger-r9.glb
          git diff --cached --quiet && exit 0
          git commit -m "Install Mechanic City Revision 14 car model [model-import]"
          git push
