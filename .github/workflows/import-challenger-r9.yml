name: Import Mechanic City Challenger Model

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-model:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[model-import]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download car model
        run: |
          mkdir -p public/models
          curl --fail --location --retry 3 --output public/models/challenger-r9.glb 'https://uc08f3952a7ac9cce71db534116b.dl.dropboxusercontent.com/cd/0/get/DJL2KpJJeJcV-Sv-9YKBXpJke97Mld6SRhbALkh2ccAhT6V135E0kKuTR6RrnZ0pzQxfc--IJRAc-fKBtVvR1chFME85hfkUfglx0NmyVopr0B1z3_9EphnbxEREMkKsKEQiz1nkBWXv0HUDy852029bIGY2k8QntIu0a7vQuVOhjA/file?c_luid=3fad07a7'
          test -s public/models/challenger-r9.glb
          ls -lh public/models/challenger-r9.glb
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/challenger-r9.glb
          git diff --cached --quiet && exit 0
          git commit -m "Add game car model [model-import]"
          git push
