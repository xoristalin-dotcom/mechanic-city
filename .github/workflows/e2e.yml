name: Mechanic City E2E
# Test the exact main branch build, including imported-car runtime fixes.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run preview -- --host 0.0.0.0 > /tmp/mechanic-city.log 2>&1 &
      - run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/?test=1 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mechanic-city.log
          exit 1
      - run: npm run test:e2e
        env:
          GAME_URL: http://127.0.0.1:4173/?test=1
